server.port=${MCP_PORT:8081}
spring.application.name=ecowarm-mcp-server

# ------------------------------------------------------------------
# Servidor MCP (Spring AI 1.0) - transporte HTTP + SSE sobre Spring MVC
# ------------------------------------------------------------------
spring.ai.mcp.server.name=ecowarm-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.sse-endpoint=/mcp/sse
spring.ai.mcp.server.sse-message-endpoint=/mcp/message

# Clave opcional que deben enviar los clientes MCP en el header X-API-Key.
# Si se deja vacía el servidor queda abierto (útil solo para desarrollo local).
mcp.api.key=${MCP_API_KEY:}

# ------------------------------------------------------------------
# Engine EcoWarm (API REST del controlador)
# ------------------------------------------------------------------
engine.url=${ENGINE_URL:http://localhost:8080}
engine.api.key=${APP_API_KEY:}

# ------------------------------------------------------------------
# Simulador (switches)
# ------------------------------------------------------------------
simulador.url=${SIMULADOR_URL:http://localhost:9090}
simulador.api.key=${SIMULADOR_API_KEY:}

# Timeouts HTTP hacia engine y simulador (ms)
mcp.http.connect-timeout-ms=2000
mcp.http.read-timeout-ms=5000

# ------------------------------------------------------------------
# Base de datos (solo lectura: histórico de temperaturas)
# ------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecowarm}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASS:}
spring.datasource.hikari.read-only=true
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.connection-timeout=3000
