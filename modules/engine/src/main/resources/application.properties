spring.application.name=ecowarm-engine

# Logs cortos: hora local, nivel y mensaje
logging.pattern.console=%d{HH:mm:ss, America/Montevideo} %-5level %msg%n

# Credencial que este controlador exige (header X-API-Key) y que declara al registrarse en el simulador
app.api.key=${APP_API_KEY}

# Dirección en la que el simulador alcanza a este controlador (se declara en el registro, §6)
controlador.base.url=${CONTROLADOR_BASE_URL:http://localhost:8080}

# Simulador: registro (§6) y clave para sus switches. Si arranca sin clave, no la exige.
simulador.url=${SIMULADOR_URL}
simulador.api.key=${SIMULADOR_API_KEY:}

# Switches. Vacío: cada uno se usa en el urlSwitch que declara su habitación en el inventario (§3 y §4).
# Definido: reemplaza a todos (útil cuando el nombre anunciado no es alcanzable desde esta red).
switches.url=${SWITCHES_URL:}

# Broker MQTT. Vacío: se usa el que anuncia el simulador al registrarnos. Definido: tiene prioridad
# (útil cuando el nombre anunciado no es alcanzable desde esta red).
mqtt.broker.url=${MQTT_BROKER_URL:}

# Base de datos PostgreSQL. El esquema (schema.sql) es idempotente y se aplica en cada arranque.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.sql.init.mode=always
