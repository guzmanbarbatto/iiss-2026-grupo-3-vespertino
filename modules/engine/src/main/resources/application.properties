# El estándar v2 exige responder en la raíz, sin el prefijo /api/v1
spring.mvc.servlet.path=/

# Conexión MQTT
mqtt.broker.url=${MQTT_BROKER_URL:tcp://localhost:1883}

# El simulador por defecto corre en el 9090 según OpenAPI
simulador.url=${SIMULADOR_URL}
simulador.api.key=${SIMULADOR_API_KEY}

# Credencial que nuestro controlador exigirá para dejarse comandar
app.api.key=${APP_API_KEY}

# BASE DE DATOS POSTGRESQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.jpa.hibernate.ddl-auto=update

# Desactivado para no saturar la consola ni la CPU con consultas cada 500ms
spring.jpa.show-sql=false