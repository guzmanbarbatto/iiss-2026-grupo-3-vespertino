# El estándar v2 exige responder en la raíz, sin el prefijo /api/v1
spring.mvc.servlet.path=/

# Conexión MQTT
mqtt.broker.url=${MQTT_BROKER_URL:tcp://localhost:1883}

# El simulador por defecto corre en el 9090 según OpenAPI
simulador.url=${SIMULADOR_URL:http://localhost:9090}

# Credencial que nuestro controlador exigirá para dejarse comandar
app.api.key=${APP_API_KEY:clave-secreta-grupo-3}

# BASE DE DATOS POSTGRESQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecowarm}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:admin}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true