services:
  # Aprovisionamiento de PostgreSQL para guardar la configuración persistente.
  postgres-db:
    image: postgres:15-alpine
    container_name: iot_postgres_db
    environment:
      POSTGRES_USER: ecowarm_user
      POSTGRES_PASSWORD: ecowarmpass
      POSTGRES_DB: ecowarm
    ports:
      - "5432:5432"
    volumes:
      - ecowarm_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - iot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecowarm_user -d ecowarm"]
      interval: 10s
      timeout: 5s
      retries: 5

  engine:
    build:
      context: ..
      dockerfile: modules/engine/Dockerfile
    image: ecowarm-engine:latest
    container_name: ecowarm_engine
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      - DB_URL=jdbc:postgresql://postgres-db:5432/ecowarm
      - DB_USER=ecowarm_user
      - DB_PASS=ecowarmpass
      - MQTT_BROKER_URL=tcp://host.docker.internal:1883
      - SIMULADOR_URL=http://host.docker.internal:9090
      - APP_API_KEY=clave-secreta-grupo-3
      - SIMULADOR_API_KEY=clave-simulador-catedra 
    networks:
      - iot-network

networks:
  iot-network:
    driver: bridge

volumes:
  ecowarm_data: