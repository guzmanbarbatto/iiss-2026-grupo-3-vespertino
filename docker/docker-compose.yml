services:
  # 1. BROKER MQTT
  mosquitto:
    image: eclipse-mosquitto:2.0.15
    container_name: iot_mosquitto_broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  # 2. BASE DE DATOS POSTGRESQL
  db:
    image: postgres:15-alpine
    container_name: iot_postgres_db
    environment:
      POSTGRES_USER: ecowarm_user
      POSTGRES_PASSWORD: ecowarmpass
      POSTGRES_DB: ecowarm
    ports:
      - "5432:5432"
    volumes:
      - ecowarm_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  # 3. SUSCRIPTOR JAVA
  java-subscriber:
    build:
      context: ../src/subscriber
      dockerfile: Dockerfile
    container_name: iot_java_subscriber
    depends_on:
      - mosquitto
      - db
    restart: on-failure

# DECLARACIÓN DEL VOLUMEN (Faltaba esta parte o estaba mal indentada)
volumes:
  ecowarm_data: