services:
  postgres-db:
    image: postgres:15-alpine
    container_name: iot_postgres_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - ecowarm_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - iot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  engine:
    build:
      context: ..
      dockerfile: modules/engine/Dockerfile
    image: ecowarm-engine:latest
    container_name: ecowarm_engine
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - iot-network

  mcp:
    build:
      context: ..
      dockerfile: modules/mcp/Dockerfile
    image: ecowarm-mcp:latest
    container_name: ecowarm_mcp_server
    ports:
      - "8081:8081"
    depends_on:
      postgres-db:
        condition: service_healthy
      engine:
        condition: service_started
    env_file:
      - .env
    environment:
      ENGINE_URL: ${ENGINE_URL:-http://engine:8080}
    networks:
      - iot-network

networks:
  iot-network:
    driver: bridge

volumes:
  ecowarm_data:
